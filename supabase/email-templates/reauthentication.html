<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Confirm your action — SnapList</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f17;
      color: #e5ecf5;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #7c9cff; text-decoration: none; }
  </style>
</head>
<body style="background-color:#0b0f17; margin:0; padding:0;">

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
         style="background-color:#0b0f17; padding: 40px 16px;">
    <tr>
      <td align="center">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:560px; background-color:#121826; border-radius:16px;
                      border:1px solid #243049; overflow:hidden;">

          <!-- Top accent bar -->
          <tr>
            <td style="height:4px; background: linear-gradient(90deg, #7c9cff 0%, #5eead4 100%);"></td>
          </tr>

          <!-- Header -->
          <tr>
            <td align="center" style="padding: 40px 40px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center"
                      style="width:52px; height:52px; background: linear-gradient(135deg, #7c9cff22 0%, #5eead422 100%);
                             border-radius:14px; border:1px solid #7c9cff44; text-align:center; vertical-align:middle;">
                    <span style="font-size:26px; line-height:52px;">&#x1F4F8;</span>
                  </td>
                </tr>
              </table>
              <p style="margin-top:16px; font-size:22px; font-weight:700; color:#e5ecf5; letter-spacing:-0.3px;">
                SnapList
              </p>
              <p style="margin-top:4px; font-size:12px; font-weight:500; color:#9aa7bd; letter-spacing:2px; text-transform:uppercase;">
                TCG Card Scanner
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding: 0 40px;">
              <div style="height:1px; background-color:#243049;"></div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 36px 40px 32px;">
              <h1 style="font-size:20px; font-weight:700; color:#e5ecf5; margin-bottom:12px; letter-spacing:-0.2px;">
                Confirm your identity
              </h1>
              <p style="color:#9aa7bd; margin-bottom:8px; line-height:1.7;">
                Use the code below to confirm your identity in the SnapList app.
              </p>

              <!-- OTP Code box -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin: 24px 0;">
                <tr>
                  <td style="background-color:#0b0f17; border:1px solid #243049; border-radius:12px; padding: 20px 36px; text-align:center;">
                    <p style="font-size:36px; font-weight:700; color:#7c9cff; letter-spacing:8px; font-variant-numeric: tabular-nums;">
                      {{ .Token }}
                    </p>
                  </td>
                </tr>
              </table>

              <p style="color:#9aa7bd; font-size:13px; line-height:1.6;">
                This code expires in <strong style="color:#e5ecf5;">10 minutes</strong>.
                If you didn't request this, please secure your account immediately.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 0 40px 36px;">
              <div style="height:1px; background-color:#243049; margin-bottom:24px;"></div>
              <p style="font-size:12px; color:#9aa7bd; text-align:center; line-height:1.7;">
                &copy; 2025 SnapList &mdash; All rights reserved.<br/>
                <a href="{{ .SiteURL }}" style="color:#7c9cff;">snaplist.gg</a>
              </p>
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
